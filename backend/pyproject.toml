[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "crop-disease-multimodal-ai"
version = "0.1.0"
description = "Research prototype for crop disease detection and diagnosis using multimodal AI"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.10,<5",
  "pillow>=11,<13",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.18,<1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.9,<1",
]
ml = [
  "torch>=2.6",
  "torchvision>=0.21",
  "pandas>=2.2,<4",
  "scikit-learn>=1.6,<2",
  "matplotlib>=3.10,<4",
  "PyYAML>=6,<7",
  "tqdm>=4.67,<5",
]
llm = [
  "openai>=2,<3",
  "google-genai>=1,<3",
  "pypdf>=6,<7",
]
rag = [
  "scikit-learn>=1.6,<2",
]
semantic-rag = [
  "scikit-learn>=1.6,<2",
  "faiss-cpu>=1.9,<2",
  "sentence-transformers>=3.4,<6",
]
reports = [
  "reportlab>=4.2,<5",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["crop_ai*", "app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = [".", "src"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["Crop_Disease_Diagram_Pack"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/ml/*.py" = ["E402"]
